name: CI/CD — Full-Stack Data Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------------------
  # Backend — test
  # ----------------------------------------------------------------
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Jest tests
        run: npm test

  # ----------------------------------------------------------------
  # Frontend — build check
  # ----------------------------------------------------------------
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ----------------------------------------------------------------
  # Docker compose integration test
  # ----------------------------------------------------------------
  integration:
    name: Docker Compose Integration
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main'
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for MySQL and backend to be ready
        run: |
          echo "Waiting 60s for MySQL to initialize and seed data..."
          sleep 60
          echo "Polling backend health..."
          for i in {1..20}; do
            curl -sf http://localhost:5000/health && echo "Backend healthy" && break
            echo "Waiting ($i/20)"
            sleep 5
          done

      - name: Run API smoke tests
        run: |
          curl -sf http://localhost:5000/health | grep '"status":"ok"'
          echo "Health OK"
          curl -sf "http://localhost:5000/api/customers?limit=5" | grep '"success":true'
          echo "List OK"
          curl -sf http://localhost:5000/api/customers/analytics | grep '"success":true'
          echo "Analytics OK"

      - name: Stop services
        if: always()
        run: docker compose down -v