name: CI/CD — Full-Stack Data Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------------------
  # Backend — lint + test
  # ----------------------------------------------------------------
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

  # ----------------------------------------------------------------
  # Frontend — build check
  # ----------------------------------------------------------------
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ----------------------------------------------------------------
  # Docker compose integration test
  # ----------------------------------------------------------------
  integration:
    name: Docker Compose Integration
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:5000/health && echo "Backend healthy" && break
            echo "Waiting… ($i/30)"
            sleep 5
          done

      - name: Run API smoke tests
        run: |
          # Health check
          curl -sf http://localhost:5000/health | grep '"status":"ok"'
          echo "✅ Health OK"

          # List customers
          curl -sf "http://localhost:5000/api/customers?limit=5" | grep '"success":true'
          echo "✅ List customers OK"

          # Analytics
          curl -sf http://localhost:5000/api/customers/analytics | grep '"success":true'
          echo "✅ Analytics OK"

      - name: Stop services
        if: always()
        run: docker compose down -v
